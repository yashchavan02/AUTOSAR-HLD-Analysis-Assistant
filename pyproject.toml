[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hld-assistant"
version = "0.1.0"
description = "AUTOSAR High-Level Design document analysis assistant (ingestion, retrieval, cited Q&A, consistency checks)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.26",
    "chromadb>=1.0",
    "fastembed>=0.6",
    "pandas>=2.2",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "ui", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
